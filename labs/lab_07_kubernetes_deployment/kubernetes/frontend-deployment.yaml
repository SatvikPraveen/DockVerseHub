apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: lab-07
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: lab-07-frontend:latest
        imagePullPolicy: Never  # For local Minikube development
        ports:
        - containerPort: 80
        # The frontend is a static Vite bundle: VITE_API_BASE_URL is inlined at
        # image build time (docker build --build-arg VITE_API_BASE_URL=...), so
        # this runtime variable does not change the URL the browser calls. It is
        # kept to document the configured API address (same as with CRA, whose
        # REACT_APP_* variables were also build-time only).
        env:
        - name: VITE_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: API_BASE_URL
        
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
