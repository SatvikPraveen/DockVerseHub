# Location: utilities/security/secrets-management/docker-secrets.yml
# Docker Swarm secrets management examples and best practices

version: '3.8'

# Docker Compose file demonstrating various secret management approaches
services:
  # Application using Docker secrets
  web-app:
    image: nginx:alpine
    ports:
      - "80:80"
    secrets:
      - ssl_cert
      - ssl_key
      - db_password
      - api_key
    environment:
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - API_KEY_FILE=/run/secrets/api_key
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.role == worker
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    networks:
      - frontend
      - backend

  # Database with secret management
  database:
    image: postgres:15-alpine
    secrets:
      - db_password
      - db_ssl_cert
      - db_ssl_key
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    volumes:
      - db_data:/var/lib/postgresql/data
    configs:
      - source: postgres_config
        target: /etc/postgresql/postgresql.conf
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    networks:
      - backend

  # Redis with password
  cache:
    image: redis:7-alpine
    secrets:
      - redis_password
    command: >
      redis-server
      --requirepass $(cat /run/secrets/redis_password)
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    deploy:
      replicas: 1
    networks:
      - backend

  # Secret rotation service
  secret-rotator:
    build:
      context: ./secret-rotator
    secrets:
      - vault_token
      - rotation_config
    environment:
      - VAULT_ADDR=https://vault.company.com
      - VAULT_TOKEN_FILE=/run/secrets/vault_token
      - CONFIG_FILE=/run/secrets/rotation_config
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - management

  # Secret backup service
  secret-backup:
    image: alpine:latest
    secrets:
      - backup_key
      - aws_credentials
    environment:
      - AWS_SHARED_CREDENTIALS_FILE=/run/secrets/aws_credentials
      - BACKUP_ENCRYPTION_KEY_FILE=/run/secrets/backup_key
    command: |
      sh -c '
        apk add --no-cache aws-cli gnupg
        # Backup secrets to S3 encrypted
        tar -czf - /run/secrets | 
        gpg --symmetric --batch --yes --passphrase-file /run/secrets/backup_key |
        aws s3 cp - s3://company-secrets-backup/secrets-$(date +%Y%m%d).tar.gz.gpg
      '
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: none
    profiles:
      - backup

# Secrets definitions
secrets:
  # SSL certificates
  ssl_cert:
    file: ./secrets/ssl/cert.pem
    labels:
      - "type=ssl"
      - "environment=production"
      
  ssl_key:
    file: ./secrets/ssl/key.pem
    labels:
      - "type=ssl" 
      - "environment=production"

  # Database credentials
  db_password:
    external: true
    # Created with: echo "secure_password" | docker secret create db_password -
    
  db_ssl_cert:
    file: ./secrets/db/server.crt
    
  db_ssl_key:
    file: ./secrets/db/server.key

  # Application secrets
  api_key:
    external: true
    # Created with: docker secret create api_key ./secrets/api_key.txt

  redis_password:
    external: true

  # Service account tokens
  vault_token:
    external: true

  # Configuration secrets
  rotation_config:
    file: ./secrets/rotation-config.json

  backup_key:
    external: true

  aws_credentials:
    file: ./secrets/aws/credentials

# Configs (non-sensitive configuration)
configs:
  nginx_config:
    file: ./configs/nginx.conf
    
  postgres_config:
    file: ./configs/postgresql.conf

# Networks
networks:
  frontend:
    driver: overlay
    external: false
    
  backend:
    driver: overlay
    internal: true
    
  management:
    driver: overlay
    internal: true

# Volumes
volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/postgres-data
      
  redis_data:
    driver: local

# Usage Examples:

# 1. Deploy the stack:
#    docker stack deploy -c docker-secrets.yml myapp

# 2. Create secrets manually:
#    echo "mysecret" | docker secret create db_password -

# 3. List secrets:
#    docker secret ls

# 4. Inspect secret (metadata only):
#    docker secret inspect db_password

# 5. Update service with new secret:
#    docker service update --secret-rm old_secret --secret-add new_secret myapp_web

# 6. Rotate secret:
#    ./scripts/rotate-secrets.sh db_password "new_password_value"

# 7. Backup secrets (metadata):
#    docker secret ls --format "{{.Name}}" | xargs -I {} docker secret inspect {} > secrets-backup.json

# 8. Remove secret:
#    docker secret rm secret_name

# 9. Run secret rotation service:
#    docker-compose --profile backup up secret-rotator

# Security Best Practices:
# - Never log secret values
# - Use external secret stores when possible  
# - Implement proper RBAC
# - Regular secret rotation
# - Monitor secret access
# - Encrypt secrets at rest
# - Use least privilege principle
# - Audit secret operations

