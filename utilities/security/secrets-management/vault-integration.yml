# Location: utilities/security/secrets-management/vault-integration.yml
# HashiCorp Vault integration for Docker secrets management

version: '3.8'

services:
  # HashiCorp Vault server
  vault:
    image: vault:1.15.0
    container_name: vault-server
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_API_ADDR: http://0.0.0.0:8200
      VAULT_LOCAL_CONFIG: |
        {
          "backend": {"consul": {"address": "consul:8500", "path": "vault/"}},
          "listener": {
            "tcp": {
              "address": "0.0.0.0:8200",
              "tls_disable": 1
            }
          },
          "ui": true,
          "disable_mlock": true,
          "default_lease_ttl": "168h",
          "max_lease_ttl": "720h"
        }
    cap_add:
      - IPC_LOCK
    volumes:
      - vault-data:/vault/data
      - vault-logs:/vault/logs
      - ./vault-config:/vault/config:ro
    command: vault server -config=/vault/config/vault.json
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - vault-network

  # Consul for Vault backend storage
  consul:
    image: consul:1.16.1
    container_name: consul-server
    ports:
      - "8500:8500"
    environment:
      CONSUL_BIND_INTERFACE: eth0
    volumes:
      - consul-data:/consul/data
    command: >
      consul agent -server -bootstrap-expect=1 -client=0.0.0.0
      -bind=0.0.0.0 -data-dir=/consul/data -ui
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - vault-network

  # Vault Agent for secret injection
  vault-agent:
    image: vault:1.15.0
    container_name: vault-agent
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
    volumes:
      - ./vault-agent-config:/vault/config:ro
      - vault-agent-data:/vault/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: vault agent -config=/vault/config/agent.hcl
    networks:
      - vault-network
    restart: unless-stopped

  # Application using Vault secrets
  app-with-vault:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: demo-app
    depends_on:
      - vault-agent
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE: app-role
    volumes:
      - vault-agent-data:/vault/secrets:ro
    networks:
      - vault-network
      - app-network
    restart: unless-stopped

  # Vault init container
  vault-init:
    image: vault:1.15.0
    container_name: vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
    volumes:
      - ./vault-init:/scripts:ro
      - vault-keys:/vault/keys
    command: /scripts/init-vault.sh
    networks:
      - vault-network
    restart: "no"
    profiles:
      - init

volumes:
  vault-data:
    driver: local
  vault-logs:
    driver: local
  vault-keys:
    driver: local
  vault-agent-data:
    driver: local
  consul-data:
    driver: local

networks:
  vault-network:
    driver: bridge
    internal: false
  app-network:
    driver: bridge

# Configuration files structure:
#
# vault-config/
# ├── vault.json           # Vault server configuration
# └── policies/            # Vault policies
#     ├── app-policy.hcl
#     └── admin-policy.hcl
#
# vault-agent-config/
# └── agent.hcl           # Vault agent configuration
#
# vault-init/
# ├── init-vault.sh       # Vault initialization script
# ├── setup-policies.sh   # Policy setup script
# └── setup-auth.sh       # Authentication setup
#
# app/
# ├── Dockerfile          # Application Dockerfile
# ├── app.py             # Application code
# └── vault-helper.py     # Vault integration helper

# Companion files referenced above (previously pasted into this file as
# extra YAML documents, which made it invalid YAML):
