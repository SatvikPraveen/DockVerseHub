# Location: ./pyproject.toml
# Tooling configuration for DockVerseHub. The repository is not a
# distributable package; this file centralises linter, formatter and test
# settings so that CI and local runs behave identically.

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
extend-exclude = '''
/(
    \.git
  | \.venv
  | node_modules
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".git", ".venv", "node_modules"]

[tool.ruff.lint]
# Keep the rule set focused on correctness; style is delegated to black.
select = ["E", "F", "W", "B", "I", "UP"]
ignore = [
  "E501",  # line length is enforced by black
  "B008",  # function calls in argument defaults are used by Flask/click patterns in labs
]

[tool.ruff.lint.per-file-ignores]
# Lab and concept scripts are pedagogical; they may keep unused imports for illustration.
"labs/**" = ["F401", "B"]
"concepts/**" = ["F401", "B"]
"utilities/**" = ["F401", "B", "UP"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "research/tests"]
addopts = "-ra --strict-markers"
markers = [
  "docker: requires a running Docker daemon (deselect with '-m \"not docker\"')",
  "slow: long-running benchmark or build (deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.10"
files = ["research/harness"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["research/harness"]
branch = true
